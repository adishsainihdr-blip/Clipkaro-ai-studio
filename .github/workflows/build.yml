
name: Build ClipKaro Android APK

"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unzip ClipKaro source archive
        run: |
          unzip -o ClipKaro-React-Android-Source.zip -d .
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps
          mkdir -p src/utils
          echo 'export const projectFilesManifest = [];' > src/utils/projectFilesManifest.ts
          if [ -f scripts/copy-ffmpeg.mjs ]; then node scripts/copy-ffmpeg.mjs; fi
          npm run build
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          rm -f android/app/src/main/assets/public/*.zip
          rm -rf android/app/src/main/assets/public/assets/aistudio
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix Kotlin duplicate
        run: |
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }" >> android/app/build.gradle
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload ClipKaro APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipKaro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
